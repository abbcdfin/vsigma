[project]
name = "vsigma"
version = "0.2.2"
description = "Cognitive architecture toolkit for autonomous systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "abbcdfin" }]
keywords = ["agents", "llm", "langgraph", "memory", "cognitive-architecture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "langgraph>=1.2.4",
    "langchain-core>=1.4",
    "httpx>=0.28.1",
    "mcp>=1.28.1,<2",
]

[project.urls]
Homepage = "https://github.com/abbcdfin/vsigma"
Repository = "https://github.com/abbcdfin/vsigma"
Changelog = "https://github.com/abbcdfin/vsigma/blob/master/CHANGELOG.md"
Issues = "https://github.com/abbcdfin/vsigma/issues"

[project.scripts]
vsigma = "vsigma.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "langgraph-checkpoint-sqlite>=3.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsigma"]

[tool.hatch.build.targets.sdist]
# vdesign/ is the project's working notes, not part of the package.
exclude = ["vdesign/"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
# Resist Entropy: keep the lint set strict but standard.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Resist Entropy: strict typing, no implicit Any.
python_version = "3.11"
strict = true
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make top-level `examples` importable in tests (it is not an installed package).
pythonpath = ["."]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
